# Release: prove the tree, publish the source archive the OpenWrt package
# fetches, build the packages with the OpenWrt SDK for both package formats,
# and attach everything to the GitHub release.
#
# How a release starts:
#   Actions -> Release -> "Run workflow": pick the branch, then whether this
#   is a patch, minor or major release. The run finds the newest version tag,
#   raises that part, and -- only once the tree has passed verification --
#   creates the tag on the chosen branch and the release with generated
#   notes. A run that fails verification leaves no tag and no release behind.
#   A tag pushed by hand (git push origin v0.1.0) or a release published in
#   the web UI is built the same way: the run creates the release if there is
#   none and attaches the files to it if there is. What this workflow creates
#   with the built-in token never re-triggers it, so a run never doubles.
#
# The package Makefile (package/openuf/Makefile) is a feed-style Makefile: it
# downloads openuf-<version>.tar.gz from the release by PKG_SOURCE_URL and
# checks PKG_HASH. So the archive has to be on the release before the SDK
# runs, and the Makefile's version, hash and download URL are substituted
# from the tag here. Both packages are architecture-independent
# (PKGARCH:=all), so one SDK per package format is enough: 24.10 produces
# .ipk (opkg), 25.12 produces .apk.
name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the newest version tag this release raises"
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
  push:
    tags: ["v[0-9]*", "[0-9]*"]
  release:
    types: [published]
permissions:
  contents: write
# A release created in the web UI with a NEW tag fires both `push` and
# `release`; serialise the pair so they do not upload the same files at once.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false
jobs:
  version:
    name: Decide the version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # every tag, to find the newest version
      - id: pick
        env:
          BUMP: ${{ inputs.bump }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              # The newest vX.Y.Z (or X.Y.Z) tag anywhere in the repository,
              # by number rather than by date; no tag yet means 0.0.0.
              latest=$(git tag -l | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
              : "${latest:=0.0.0}"
              major=${latest%%.*}; rest=${latest#*.}; minor=${rest%%.*}; patch=${rest#*.}
              case "$BUMP" in
                major) major=$((major + 1)); minor=0; patch=0 ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                patch) patch=$((patch + 1)) ;;
                *) echo "unknown bump '$BUMP'" >&2; exit 1 ;;
              esac
              tag="v$major.$minor.$patch"
              if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                echo "tag $tag already exists" >&2; exit 1
              fi
              echo "newest version tag $latest, $BUMP release: $tag"
              ;;
            release) tag="$RELEASE_TAG" ;;
            *)       tag="$GITHUB_REF_NAME" ;;
          esac
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing **$tag** (version $version) from \`$GITHUB_REF_NAME\` at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify, then create the release with the source archive
    needs: version
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.meta.outputs.sha256 }}
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # The event's own commit: the chosen branch's head, or the tag's commit.
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 and the bindings the suite needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 liblua5.1-dev lua-bitop luarocks openssl dash
          sudo ln -sf /usr/bin/lua5.1 /usr/local/bin/lua
          sudo luarocks --lua-version 5.1 install lua-cjson LUA_INCDIR=/usr/include/lua5.1
      - name: Shell syntax, both shells
        run: |
          for f in setup.sh install.sh update.sh tools/deploy.sh tools/dist.sh \
              tools/release-archive.sh openuf/etc/init.d/openuf openuf/hook/*.sh \
              package/openuf/test.sh; do
            bash -n "$f" && dash -n "$f"
          done
      - name: Build the archives (dist.sh --verify runs the suite on the stripped tree)
        id: meta
        run: |
          sh tools/release-archive.sh "$VERSION"
          sha256sum openuf.tar.gz > openuf.tar.gz.sha256
          echo "sha256=$(cut -d' ' -f1 "openuf-$VERSION.tar.gz.sha256")" >> "$GITHUB_OUTPUT"
      - name: Create the release (and its tag) unless it exists, then attach the source archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # A tag that does not exist yet is created at this run's commit.
            gh release create "$TAG" --target "$GITHUB_SHA" --title "openUF $TAG" --generate-notes
          fi
          gh release upload "$TAG" --clobber \
            openuf-"$VERSION".tar.gz openuf-"$VERSION".tar.gz.sha256 openuf.tar.gz openuf.tar.gz.sha256

  packages:
    name: Build ${{ matrix.format }} with the ${{ matrix.sdk }} SDK
    needs: [version, verify]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      SHA256: ${{ needs.verify.outputs.sha256 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Branch snapshot SDK images track each release branch; pin to a
          # point release (e.g. x86_64-24.10.4) once one is known good.
          - sdk: x86_64-24.10-SNAPSHOT
            format: ipk
          - sdk: x86_64-25.12-SNAPSHOT
            format: apk
    steps:
      - uses: actions/checkout@v4
      - name: Point the Makefiles at this release's archive
        run: |
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$VERSION/" package/openuf/Makefile package/luci-app-openuf/Makefile
          sed -i "s/^PKG_HASH:=.*/PKG_HASH:=$SHA256/" package/openuf/Makefile
          # The committed URL says v<version>; a tag made by hand may lack the v.
          sed -i "s|/releases/download/[^/]*/|/releases/download/$TAG/|" package/openuf/Makefile
          grep -E '^PKG_(VERSION|HASH|SOURCE_URL):=' package/openuf/Makefile
      - name: Build with the OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.sdk }}
          FEEDNAME: openuf
          FEED_DIR: ${{ github.workspace }}/package
          PACKAGES: openuf luci-app-openuf
          NO_REFRESH_CHECK: true
          V: s
      - name: Collect the packages
        run: |
          mkdir -p out
          find bin -type f \( -name 'openuf*.ipk' -o -name 'openuf*.apk' -o -name 'luci-app-openuf*.ipk' -o -name 'luci-app-openuf*.apk' \) -exec cp -v {} out/ \;
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: openuf-${{ matrix.format }}
          path: out/*
      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" --clobber out/*

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build release tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build openuf.tar.gz
        run: |
          tar czf openuf.tar.gz openuf install.sh README.md USAGE.md LICENSE

      - name: Generate checksum
        run: sha256sum openuf.tar.gz > openuf.tar.gz.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            openuf.tar.gz
            openuf.tar.gz.sha256
          generate_release_notes: true

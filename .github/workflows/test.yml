name: Tests

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  lua-tests:
    name: Lua unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 luarocks openssl
          # lua-cjson requires lua5.1 dev headers
          sudo apt-get install -y liblua5.1-dev
          sudo luarocks install lua-cjson

      - name: Run tests
        run: lua5.1 tests/run_tests.lua

  python-controller-syntax:
    name: Python controller syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax
        run: python3 -m py_compile tools/test_controller.py && echo "OK"

  shell-syntax:
    name: Shell script syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check install.sh and check.sh
        run: |
          bash -n install.sh
          bash -n tools/check.sh
          bash -n openuf/etc/init.d/openuf || true  # uses /etc/rc.common sourcing, not plain bash
